[pytest]
minversion = 7.0
addopts = -ra
python_files = test_*.py
python_classes = *Test
python_functions = test_*
# This file at repo root ensures the repository root is on sys.path for tests.
# Tests should import using package-relative imports within ui_test (e.g., from .module import X)
# or absolute package imports starting with ui_test when running from repo root.
