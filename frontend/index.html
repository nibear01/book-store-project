<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookStop</title>
    <script>
      // NUCLEAR OPTION: Complete browser error suppression
      (function() {
        // Complete console override
        const originalConsole = window.console;
        ['log', 'warn', 'error', 'info', 'debug'].forEach(method => {
          const original = originalConsole[method];
          originalConsole[method] = function(...args) {
            const argsStr = args.map(arg => {
              try { return typeof arg === 'string' ? arg : JSON.stringify(arg); }
              catch { return String(arg); }
            }).join(' ');
            
            // Block all extension errors
            if (argsStr.includes('content.js') || argsStr.includes('"name":"i"') || 
                argsStr.includes('"code":403') || argsStr.includes('permission error') ||
                argsStr.includes('/site_integration') || argsStr.includes('/writing') ||
                args.some(arg => arg && arg.name === 'i' && arg.code === 403)) {
              return;
            }
            original.apply(originalConsole, args);
          };
        });
        
        // Nuclear error suppression
        window.onerror = () => true;
        window.onunhandledrejection = (e) => { e.preventDefault(); return false; };
        
        // Promise constructor override
        const OriginalPromise = window.Promise;
        window.Promise = class extends OriginalPromise {
          constructor(executor) {
            super((resolve, reject) => {
              executor(resolve, (reason) => {
                if (reason && (reason.name === 'i' || reason.code === 403)) {
                  resolve(); return;
                }
                reject(reason);
              });
            });
          }
        };
        Object.setPrototypeOf(window.Promise, OriginalPromise);
        window.Promise.reject = (reason) => {
          if (reason && (reason.name === 'i' || reason.code === 403)) {
            return window.Promise.resolve();
          }
          return OriginalPromise.reject(reason);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
